<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Incident</title>

  <!-- PWA Meta -->
  <meta name="application-name" content="Report Incident" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Report Incident" />
  <meta name="theme-color" content="#08488D" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />

  <!-- Poppins font (matches Caswells brand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #08488D;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px 36px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    }

    .icon-wrap {
      width: 88px;
      height: 88px;
      background: #EC1C24;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon-wrap svg {
      width: 48px;
      height: 48px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #08488D;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.88rem;
      color: #555;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #EC1C24;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:active {
      background: #c0151b;
      transform: scale(0.98);
    }

    .brand {
      margin-top: 28px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* iOS install hint */
    .install-hint {
      display: none;
      font-size: 0.75rem;
      color: #888;
      margin-top: 14px;
      line-height: 1.5;
    }
    .install-hint.visible { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <!-- Warning triangle SVG -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M24 6L44 42H4L24 6Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M24 20V30" stroke="#EC1C24" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="24" cy="36.5" r="2" fill="#EC1C24"/>
      </svg>
    </div>

    <h1>Incident &amp; Near Miss Report</h1>
    <p>Use this form to report any incident, accident, near miss, or unsafe condition. Reports are sent directly to the QHSE team.</p>

    <a class="btn" id="formBtn" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=OhDCfWrJdUGZM9I_f6mtmjYaKB-AedJFpW5p97gXbYlURUIyR09NMUlRWklCV0JXTU5ZUzU3TjBTOS4u" target="_blank" rel="noopener noreferrer">
      Open Report Form
    </a>
    <div class="install-hint" id="installHint">
      📲 To add to your home screen:<br>
      tap <strong>Share</strong> → <strong>Add to Home Screen</strong>
    </div>
  </div>

  <p class="brand">Caswells Group · QHSE</p>

  <script>
    // Show "Add to Home Screen" hint on iOS Safari only
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isInStandalone = window.navigator.standalone === true;
    if (isIOS && !isInStandalone) {
      document.getElementById('installHint').classList.add('visible');
    }
  </script>

</body>
</html>
